name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# ponytail: guard so a manual workflow_dispatch run can never publish —
# only a real v* tag publishes. Mirrors opencode-model-fallback/release.yml.
jobs:
  publish-npm:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm (skip if this version is already published)
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; skipping publish."
          else
            # --provenance: OIDC supply-chain attestation (needs id-token: write);
            # NPM_TOKEN still authenticates. Matches the pattern used in
            # ShutovKS/opencode-model-fallback.
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --latest
